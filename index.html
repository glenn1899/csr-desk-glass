<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSR Desk</title>
<meta name="theme-color" content="#e7eef6">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 480px at 8% -10%, rgba(120,180,255,.45), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(255,186,150,.35), transparent 55%),
      radial-gradient(800px 500px at 70% 110%, rgba(150,210,190,.35), transparent 50%),
      #e7eef6;
  }
  button, summary { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .wrap { max-width: 64rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
  .glass {
    border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 10px 28px rgba(40,55,90,.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }
  .top, .board { display: grid; gap: 1.5rem; align-items: start; }
  .board { margin-top: 1.5rem; }
  h1 { margin: 0; font-size: 2rem; line-height: 1; font-weight: 600; letter-spacing: -.03em; }
  .rail { margin-top: 1rem; display: flex; gap: .375rem; min-width: 0; overflow-x: auto; padding-bottom: .25rem; }
  .rail button {
    min-height: 3.5rem; min-width: 7rem; flex: 1 1 0;
    border-radius: 20px; padding: .5rem .6rem; text-align: left;
    border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 10px 28px rgba(40,55,90,.08);
  }
  .rail button[aria-pressed="true"] { background: rgba(29,29,31,.82); color: #fff; }
  .rail button.past { background: rgba(255,255,255,.4); color: #6e6e73; }
  .rail .win { display: flex; align-items: center; gap: .35rem; font-size: 11px; letter-spacing: .04em; }
  .rail .dot { width: .375rem; height: .375rem; border-radius: 999px; background: #007aff; }
  .rail .name { display: block; margin-top: .125rem; font-size: 13px; font-weight: 500; }
  .clock-col { width: 9rem; justify-self: center; }
  .clock { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 16px 30px rgba(40,60,100,.16)); }
  .date { margin: .5rem 0 0; text-align: center; font-size: 13px; color: #86868b; white-space: nowrap; }
  .card { min-width: 0; overflow: hidden; border-radius: 28px; }
  .meter { height: .375rem; background: rgba(0,0,0,.05); }
  .meter > span { display: block; height: 100%; background: #007aff; }
  .pad { padding: 1.75rem 1.5rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  .pill {
    display: inline-flex; align-items: center; border-radius: 999px;
    padding: .25rem .75rem; border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.55); box-shadow: inset 0 1px 0 #fff;
  }
  .now-kicker { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #007aff; }
  .left { font-size: .875rem; font-weight: 500; font-variant-numeric: tabular-nums; color: #3a3a3c; }
  .left.urgent { color: #ff3b30; }
  h2.title { margin: 1rem 0 0; font-size: 2.5rem; line-height: 1; font-weight: 600; letter-spacing: -.035em; }
  .window { margin-top: 1rem; font-size: 15px; font-weight: 500; color: #3a3a3c; font-variant-numeric: tabular-nums; }
  .manager { margin: .75rem 0 0; font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: #007aff; }
  .phone { margin-top: 1.5rem; display: flex; align-items: center; gap: .75rem; border-radius: 22px; padding: .75rem 1rem; }
  .phone .well {
    width: 2.75rem; height: 2.75rem; flex: 0 0 auto; display: grid; place-items: center;
    border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid rgba(255,255,255,.8);
  }
  .phone .k { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .6; }
  .phone .v { margin: 0; font-size: 17px; font-weight: 600; }
  .tasks { margin-top: 1.5rem; overflow: hidden; border-radius: 22px; padding: .25rem 1rem; }
  .task {
    display: grid; grid-template-columns: 2.75rem 5.25rem minmax(0,1fr);
    align-items: start; column-gap: .75rem;
    border-top: 1px solid rgba(0,0,0,.05); padding: .75rem 0;
  }
  .task:first-child { border-top: 0; }
  .task.off { opacity: .45; }
  .box {
    width: 1.5rem; height: 1.5rem; border-radius: 7px;
    display: grid; place-items: center; background: rgba(255,255,255,.8);
    box-shadow: inset 0 0 0 1px #c7c7cc;
  }
  .box.on { background: #007aff; box-shadow: none; animation: pop 220ms ease-out; }
  .box svg { width: .875rem; height: .875rem; }
  .hit { width: 2.75rem; height: 1.5rem; display: grid; place-items: center; }
  .chip {
    height: 1.5rem; display: flex; align-items: center; justify-content: center;
    border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    background: rgba(0,0,0,.05); color: #6e6e73;
  }
  .chip.do { background: rgba(0,122,255,.12); color: #007aff; }
  .task p { margin: 0; font-size: 16px; line-height: 1.5rem; }
  .task p.done { color: #86868b; }
  .due { margin-top: .25rem; font-size: 13px; line-height: 1.25rem; color: #86868b; }
  .due.late { color: #ff3b30; font-weight: 500; }
  .count { margin: 1rem 0 0; font-size: 13px; color: #86868b; font-variant-numeric: tabular-nums; }
  .exit { margin: 1.5rem 0 0; padding-top: 1.25rem; border-top: 1px solid #e5e5ea; font-size: 15px; line-height: 1.45; color: #6e6e73; }
  .next {
    border-radius: 28px; padding: 1rem; color: #6e6e73; filter: grayscale(1);
    background: rgba(255,255,255,.3);
  }
  .next h2 { margin: .5rem 0 0; font-size: 17px; line-height: 1.25; font-weight: 500; }
  .next .meta, .next li, .next .kicker { font-size: 12px; }
  .next .kicker { margin: 0; letter-spacing: .04em; text-transform: uppercase; }
  .next ul { margin: .75rem 0 0; padding: .75rem 0 0; list-style: none; border-top: 1px solid rgba(0,0,0,.1); }
  .next li { margin: 0 0 .5rem; line-height: 1.45; }
  .next li b { font-weight: 500; }
  .remain { margin-top: .5rem; display: flex; align-items: center; gap: .75rem; }
  .track { height: .375rem; flex: 1; border-radius: 999px; background: rgba(0,0,0,.1); overflow: hidden; }
  .track > span { display: block; height: 100%; border-radius: 999px; background: #007aff; }
  .remain b { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; color: #1d1d1f; }
  .banner {
    margin-bottom: 1.25rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem;
    border-radius: 999px; background: #1d1d1f; color: #fff; padding: .5rem .5rem .5rem 1rem; font-size: .875rem;
  }
  .banner button { min-height: 2.25rem; border-radius: 999px; background: #fff; color: #1d1d1f; padding: 0 .75rem; font-weight: 500; }
  details { margin-top: 2rem; }
  summary { display: flex; min-height: 2.75rem; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 500; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary svg { width: 1rem; height: 1rem; color: #86868b; transition: transform .2s; }
  details[open] summary svg { transform: rotate(180deg); }
  .day { margin-top: .5rem; overflow: hidden; border-radius: 22px; }
  .day button, .day .foot { width: 100%; display: flex; gap: .75rem; text-align: left; padding: .75rem 1rem; border-bottom: 1px solid rgba(0,0,0,.04); }
  .day .foot { display: block; font-size: 13px; color: #6e6e73; border: 0; }
  .day .mark { width: .5rem; height: .5rem; margin-top: .4rem; border-radius: 999px; background: #d2d2d7; flex: 0 0 auto; }
  .day .mark.live { background: #007aff; }
  .day .when { width: 7rem; flex: 0 0 auto; font-size: 13px; color: #86868b; font-variant-numeric: tabular-nums; }
  .day .ttl { display: block; font-size: 15px; font-weight: 500; }
  .day .sub { display: block; margin-top: .125rem; font-size: 13px; color: #86868b; }
  .fine { margin: 2rem 0 0; font-size: 12px; color: #86868b; }
  .hero { padding: 2.5rem 1.75rem; border-radius: 28px; }
  .hero h2 { margin: .5rem 0 0; font-size: 3rem; line-height: 1; letter-spacing: -.03em; }
  .hero p { color: #6e6e73; font-size: 1.125rem; }
  .tick { width: 3.5rem; height: 3.5rem; display: grid; place-items: center; border-radius: 999px; background: #34c759; color: #fff; }
  @media (min-width: 1024px) {
    .top, .board { grid-template-columns: minmax(0,1.7fr) minmax(16rem,.85fr); column-gap: 2rem; }
    .rail { overflow: visible; }
    .rail button { min-width: 0; }
    h2.title { font-size: 3.75rem; }
    .next { position: sticky; top: 1.5rem; }
    .pad { padding: 2rem; }
  }
  @keyframes pop { 0% { transform: scale(.82); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<main class="wrap">
  <p class="sr" id="live" aria-live="polite"></p>
  <div id="banner"></div>
  <div class="top">
    <div>
      <h1>CSR Desk</h1>
      <nav class="rail" id="rail" aria-label="Day blocks"></nav>
    </div>
    <div class="clock-col">
      <div id="face" role="img" aria-label="Eastern time">
        <svg class="clock" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="rim" x1="20%" y1="0%" x2="80%" y2="100%">
              <stop offset="0%" stop-color="#fff" stop-opacity=".95"/>
              <stop offset="45%" stop-color="#d7e4f2" stop-opacity=".55"/>
              <stop offset="100%" stop-color="#fff" stop-opacity=".85"/>
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="97" fill="url(#rim)"/>
          <circle cx="100" cy="100" r="88" fill="rgba(255,255,255,.72)"/>
          <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>
          <g transform="translate(100 100)" stroke="#1d1d1f" stroke-linecap="round" opacity=".55" id="ticks"></g>
          <g fill="#1d1d1f" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
            <text x="100" y="36" text-anchor="middle" dominant-baseline="central">12</text>
            <text x="164" y="104" text-anchor="middle" dominant-baseline="central">3</text>
            <text x="100" y="172" text-anchor="middle" dominant-baseline="central">6</text>
            <text x="36" y="104" text-anchor="middle" dominant-baseline="central">9</text>
          </g>
          <g transform="translate(100 100)">
            <g id="hour"><line y1="8" y2="-46" stroke="#1d1d1f" stroke-width="3.5" stroke-linecap="round"/></g>
            <g id="minute"><line y1="10" y2="-64" stroke="#1d1d1f" stroke-width="2.25" stroke-linecap="round"/></g>
            <g id="second"><line y1="18" y2="-70" stroke="#ff3b30" stroke-width="1" stroke-linecap="round"/></g>
          </g>
          <circle cx="100" cy="100" r="3" fill="#1d1d1f"/>
        </svg>
      </div>
      <p class="date" id="date">Eastern</p>
    </div>
  </div>
  <div class="board">
    <div id="now"></div>
    <div id="next"></div>
  </div>
  <div id="tail"></div>
  <p class="fine">Sheet updated Oct 29, 2026. Eastern time.</p>
</main>
<script>
(function () {
  var EXIT = "Inbox and voicemail at zero, or every open item has an owner and a deadline.";
  var TAG = { do: "Do now", resolve: "Resolve", batch: "Batch", park: "Park", note: "Note" };
  var SHORT = { January:"Jan", February:"Feb", March:"Mar", April:"Apr", May:"May", June:"Jun", July:"Jul", August:"Aug", September:"Sep", October:"Oct", November:"Nov", December:"Dec" };
  var BLOCKS = [
    { id:"before", start:0, end:570, from:480, window:"Before 9:30", title:"Onboarding review", short:"Open", manager:true, phone:null, tasks:[
      { id:"before-abeyance", tag:"do", text:"Check the abeyance list. Flag anything overdue." },
      { id:"before-claims", tag:"do", text:"Export the claims report by insurer.", monday:true, due:540 }
    ]},
    { id:"morning", start:570, end:630, window:"9:30–10:30", title:"Morning batch", short:"Morning", phone:{ mode:"off", label:"No phone." }, tasks:[
      { id:"morning-clear", tag:"do", text:"Clear overnight voicemail and email. Glance at the claims list for anything stalled. Knock out anything due today." },
      { id:"morning-resolve", tag:"resolve", text:"By 10:30, every item has an answer: call back now, file with a note, or promise a time." }
    ]},
    { id:"midday", start:630, end:870, window:"10:30–2:30", title:"Midday block", short:"Midday", phone:{ mode:"finish", label:"Phone on, finish-now only." }, tasks:[
      { id:"midday-now", tag:"do", text:"ID cards, proof of insurance, claim status, simple changes." },
      { id:"midday-batch", tag:"batch", text:"60-day renewal emails batched here. Emails and texts outside 30 days go out as heads-up notices." },
      { id:"midday-park", tag:"park", text:"More than a quick fix (about 2 minutes or more)? Park it with a promised time." },
      { id:"midday-resolve", tag:"resolve", text:"Triage rule: park longer work to the 2:30–3:30 protected block, where those tasks are batched." }
    ]},
    { id:"protected", start:870, end:930, window:"2:30–3:30", title:"Protected block", short:"Protected", phone:{ mode:"overflow", label:"Phone to overflow and voicemail." }, tasks:[
      { id:"protected-renewals", tag:"do", text:"First: renewal calls for policies renewing within 30 days." },
      { id:"protected-batch", tag:"batch", text:"Then parked work: endorsements, file admin." }
    ]},
    { id:"agency", start:930, end:940, window:"3:30–3:40", title:"Agency-bill mini-block", short:"Agency bill", phone:{ mode:"on", label:"Phone on." }, tasks:[
      { id:"agency-remind", tag:"do", text:"Send payment-due reminders on agency-bill accounts. A lapse is the one thing a later call can’t undo." },
      { id:"agency-note", tag:"note", text:"Call, text, or email, depending on the collections-reminder stage." }
    ]},
    { id:"afternoon", start:940, end:1020, window:"3:40–5:00", title:"Afternoon phones", short:"Afternoon", phone:{ mode:"finish", label:"Phone back on, finish-now only." }, tasks:[
      { id:"afternoon-overflow", tag:"do", text:"Clear the overflow." },
      { id:"afternoon-abeyance", tag:"do", text:"Export abeyance reports before the end of the day." },
      { id:"afternoon-park", tag:"park", text:"Before you leave, every open item gets an owner and a time." }
    ]}
  ];
  var preview = null;
  var checks = [];
  var ymd = "";
  var sig = "";
  var seen = undefined;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return "&" + { "&":"amp", "<":"lt", ">":"gt", '"':"quot", "'":"#39" }[c] + ";";
    });
  }
  function part(parts, type) {
    for (var i = 0; i < parts.length; i++) if (parts[i].type === type) return parts[i].value;
    return "";
  }
  function clockOf(date) {
    var parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Toronto", weekday: "short", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23", timeZoneName: "short"
    }).formatToParts(date);
    var hour = Number(part(parts, "hour"));
    var minute = Number(part(parts, "minute"));
    var second = Number(part(parts, "second"));
    var weekday = part(parts, "weekday");
    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    if (days.indexOf(weekday) < 0) weekday = "Mon";
    return {
      ymd: part(parts, "year") + "-" + part(parts, "month") + "-" + part(parts, "day"),
      weekday: weekday, minutes: hour * 60 + minute, seconds: second,
      dateLabel: new Intl.DateTimeFormat("en-US", { timeZone:"America/Toronto", weekday:"long", month:"long", day:"numeric" }).format(date),
      tz: part(parts, "timeZoneName") || "ET"
    };
  }
  function liveId(c) {
    if (c.weekday === "Sat" || c.weekday === "Sun") return null;
    for (var i = 0; i < BLOCKS.length; i++) if (c.minutes >= BLOCKS[i].start && c.minutes < BLOCKS[i].end) return BLOCKS[i].id;
    return null;
  }
  function focusFor(c) {
    if (preview) {
      for (var i = 0; i < BLOCKS.length; i++) if (BLOCKS[i].id === preview) {
        var mon = c.weekday === "Mon";
        return { kind:"block", block: BLOCKS[i], next: BLOCKS[i + 1] || null, later: false, monday: mon };
      }
    }
    if (c.weekday === "Sat" || c.weekday === "Sun") return { kind:"weekend", block:null, next:null, later:true, monday:false };
    for (var j = 0; j < BLOCKS.length; j++) {
      if (c.minutes >= BLOCKS[j].start && c.minutes < BLOCKS[j].end) {
        var nxt = BLOCKS[j + 1] || null;
        return { kind:"block", block: BLOCKS[j], next: nxt, later: !nxt, monday: c.weekday === "Mon" };
      }
    }
    return { kind:"closed", block:null, next:null, later:true, monday:false };
  }
  function until(min, c) { return (min - c.minutes) * 60 - c.seconds; }
  function spanText(total) {
    var sec = Math.max(0, total), h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (sec < 15 * 60) return m + "m " + (s < 10 ? "0" : "") + s + "s";
    if (h > 0) return m > 0 ? h + "h " + m + "m" : h + "h";
    return m + "m";
  }
  function progress(block, c) {
    var origin = block.from == null ? block.start : block.from;
    if (c.minutes < origin) return 0;
    var span = (block.end - origin) * 60;
    if (span <= 0) return 1;
    return Math.max(0, Math.min(1, ((c.minutes - origin) * 60 + c.seconds) / span));
  }
  function waitSpan(next) {
    var i = BLOCKS.indexOf(next), prev = i > 0 ? BLOCKS[i - 1] : null;
    if (!prev) return Math.max(60, next.start * 60);
    var origin = prev.from == null ? prev.start : prev.from;
    return Math.max(60, (next.start - origin) * 60);
  }
  function load(day) {
    try {
      var raw = localStorage.getItem("csr-desk-glass-checks");
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!parsed || parsed.ymd !== day || !Array.isArray(parsed.ids)) return [];
      return parsed.ids;
    } catch (e) { return []; }
  }
  function save(day) {
    localStorage.setItem("csr-desk-glass-checks", JSON.stringify({ ymd: day, ids: checks }));
  }
  function phoneSvg(mode) {
    var color = mode === "off" || mode === "overflow" ? "#ff3b30" : mode === "on" ? "#34c759" : "#1d1d1f";
    if (mode === "overflow") return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="' + color + '" stroke-width="1.75"><circle cx="6" cy="12" r="3.2"/><circle cx="18" cy="12" r="3.2"/><path d="M6 15.2h12"/></svg>';
    var slash = mode === "off" ? '<path d="M4 4l16 16"/>' : "";
    return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="' + color + '" stroke-width="1.75" stroke-linecap="round"><path d="M7 3.5h2.2l1.2 3-1.6 1a12 12 0 0 0 5.7 5.7l1-1.6 3 1.2V15a2 2 0 0 1-2.2 2A15 15 0 0 1 5 6.7 2 2 0 0 1 7 3.5z"/>' + slash + '</svg>';
  }
  function checkSvg(on) {
    return '<span class="box' + (on ? " on" : "") + '"><svg viewBox="0 0 16 16"><path d="M3.2 8.2 L6.5 11.2 L12.8 4.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:16;stroke-dashoffset:' + (on ? 0 : 16) + ';transition:stroke-dashoffset 180ms ease-out"/></svg></span>';
  }
  function taskHtml(task, c, live, interactive) {
    var inactive = task.monday && !c.monday;
    var on = checks.indexOf(task.id) >= 0;
    var late = live && c.monday && task.due != null && !on && c.clock.minutes >= task.due;
    var box = interactive
      ? '<button class="hit" type="button" data-check="' + task.id + '" role="checkbox" aria-checked="' + on + '" aria-label="' + esc(task.text) + '">' + checkSvg(on) + "</button>"
      : '<span class="hit">' + checkSvg(false) + "</span>";
    var due = task.due != null ? '<p class="due' + (late ? " late" : "") + '">' + (late ? "This was due before 9:00." : "Due before 9:00.") + "</p>" : "";
    return '<li class="task' + (inactive ? " off" : "") + '">' + box +
      '<span class="chip' + (task.tag === "do" && !inactive ? " do" : "") + '">' + esc(inactive ? "Mon" : TAG[task.tag]) + "</span>" +
      '<div><p class="' + (on ? "done" : "") + '">' + esc(task.text) + "</p>" + due + "</div></li>";
  }
  function nowHtml(c) {
    var f = c.focus, block = f.block;
    if (f.kind === "weekend") {
      return '<section class="hero glass"><p style="margin:0;font-size:13px;font-weight:500;color:#86868b">Weekend</p><h2>Office closed</h2><p>No blocks today.</p></section>';
    }
    if (f.kind !== "block" || !block) {
      return '<section class="hero glass"><div class="tick"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2.5"><path d="M5 12.5 9.5 17 19 7"/></svg></div><h2>Done</h2><p>No blocks left today.</p><p class="exit"><b style="color:#1d1d1f">Exit check. </b>' + esc(EXIT) + "</p></section>";
    }
    var left = c.preview ? null : until(block.end, c.clock);
    var urgent = left != null && left < 15 * 60;
    var tasks = block.tasks.filter(function (t) { return t.tag !== "note" && (!t.monday || f.monday); });
    var done = tasks.filter(function (t) { return checks.indexOf(t.id) >= 0; }).length;
    var phone = block.phone ? '<div class="phone glass">' + '<span class="well">' + phoneSvg(block.phone.mode) + "</span><div><p class=\"k\">Phone</p><p class=\"v\">" + esc(block.phone.label) + "</p></div></div>" : "";
    var rows = block.tasks.map(function (t) { return taskHtml({ monday: !!t.monday, due: t.due, id: t.id, tag: t.tag, text: t.text }, { monday: f.monday, clock: c.clock }, !c.preview, true); }).join("");
    return '<section class="card glass">' +
      (c.preview ? "" : '<div class="meter"><span id="meter" style="width:' + (progress(block, c.clock) * 100) + '%"></span></div>') +
      '<div class="pad"><div class="row"><p class="pill now-kicker">' + (c.preview ? "Preview" : "Now") + "</p>" +
      (left == null ? "" : '<p class="pill left' + (urgent ? " urgent" : "") + '" id="left">' + (left <= 0 ? "Ending" : spanText(left) + " left") + "</p>") +
      "</div><h2 class=\"title\">" + esc(block.title) + "</h2>" +
      '<p class="pill window">' + esc(block.window) + "</p>" +
      (block.manager ? '<p class="manager">Manager</p>' : "") +
      phone + '<ul class="tasks glass">' + rows + "</ul>" +
      (tasks.length ? '<p class="count" id="count">' + (done === tasks.length ? "Clear" : done + " of " + tasks.length) + "</p>" : "") +
      (block.id === "afternoon" ? '<p class="exit"><b style="color:#1d1d1f">Exit check. </b>' + esc(EXIT) + "</p>" : "") +
      "</div></section>";
  }
  function nextHtml(c) {
    var block = c.focus.next;
    if (!block || c.focus.later) return "";
    var remain = c.preview ? null : Math.max(0, until(block.start, c.clock));
    var frac = remain == null ? 0 : Math.min(1, remain / waitSpan(block));
    var items = block.tasks.map(function (t) {
      var inactive = t.monday && !c.focus.monday;
      return "<li><b>" + esc(inactive ? "Mon" : TAG[t.tag]) + "</b><span style=\"display:block\">" + esc(t.text) + "</span></li>";
    }).join("");
    return '<aside class="next glass"><p class="kicker">Up next</p>' +
      (remain == null ? "" : '<div class="remain"><div class="track"><span id="remain" style="width:' + (frac * 100) + '%"></span></div><b id="remain-label">' + spanText(remain) + "</b></div>") +
      "<h2>" + esc(block.title) + "</h2><p class=\"meta\">" + esc(block.window) + "</p>" +
      (block.phone ? '<p class="meta">' + esc(block.phone.label) + "</p>" : "") +
      "<ul>" + items + "</ul></aside>";
  }
  function paintStructure(c) {
    var live = liveId(c.clock);
    document.getElementById("banner").innerHTML = c.preview && c.focus.block
      ? '<div class="banner"><p>Previewing ' + esc(c.focus.block.window) + ".</p><button type=\"button\" id=\"back\">Back</button></div>" : "";
    document.getElementById("rail").innerHTML = BLOCKS.map(function (b) {
      var past = c.clock.weekday !== "Sat" && c.clock.weekday !== "Sun" && c.clock.minutes >= b.end;
      var on = c.focus.block && c.focus.block.id === b.id;
      return '<button type="button" data-pick="' + b.id + '" aria-pressed="' + on + '"' + (past && !on ? ' class="past"' : "") + ">" +
        '<span class="win">' + (b.id === live ? '<span class="dot"></span>' : "") + esc(b.window) + "</span>" +
        '<span class="name">' + esc(b.short) + "</span></button>";
    }).join("");
    document.getElementById("now").innerHTML = nowHtml(c);
    document.getElementById("next").innerHTML = nextHtml(c);
    document.getElementById("tail").innerHTML =
      '<details><summary>Whole day <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></summary><div class="day glass">' +
      BLOCKS.map(function (b) {
        var on = c.focus.block && c.focus.block.id === b.id;
        return '<button type="button" data-pick="' + b.id + '"><span class="mark' + (b.id === live ? " live" : "") + '"></span><span class="when">' + esc(b.window) + '</span><span><span class="ttl">' + esc(b.title) + (b.id === live ? " · now" : on && c.preview ? " · preview" : "") + "</span>" + (b.phone ? '<span class="sub">' + esc(b.phone.label) + "</span>" : "") + "</span></button>";
      }).join("") +
      '<p class="foot"><b style="color:#1d1d1f">Exit check. </b>' + esc(EXIT) + "</p></div></details>";
    var back = document.getElementById("back");
    if (back) back.onclick = function () { preview = null; sig = ""; render(); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-pick]"), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-pick");
        preview = preview === id || id === live ? null : id;
        sig = "";
        render();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-check]"), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-check");
        var i = checks.indexOf(id);
        if (i >= 0) checks.splice(i, 1); else checks.push(id);
        save(ymd);
        sig = "";
        render();
      };
    });
  }
  function render() {
    var now = new Date();
    var clock = clockOf(now);
    if (clock.ymd !== ymd) { ymd = clock.ymd; checks = load(ymd); sig = ""; }
    var focus = focusFor(clock);
    var id = liveId(clock);
    if (seen !== undefined && seen !== id && !preview) {
      var name = id ? BLOCKS.filter(function (b) { return b.id === id; })[0].title : "Done for today";
      document.getElementById("live").textContent = "Now: " + name;
    }
    seen = id;
    var match = clock.dateLabel.match(/^(.+), ([A-Za-z]+) (\d+)$/);
    document.getElementById("date").textContent = match ? match[1] + ", " + (SHORT[match[2]] || match[2]) + " " + match[3] + " · " + clock.tz : clock.dateLabel;
    document.getElementById("face").setAttribute("aria-label", clock.dateLabel);
    var nextSig = ymd + "|" + (preview || "") + "|" + checks.join(",") + "|" + focus.kind + "|" + (focus.block ? focus.block.id : "");
    if (nextSig !== sig) {
      sig = nextSig;
      paintStructure({ clock: clock, focus: focus, preview: preview });
    } else if (focus.block && !preview) {
      var meter = document.getElementById("meter");
      if (meter) meter.style.width = (progress(focus.block, clock) * 100) + "%";
      var left = document.getElementById("left");
      if (left) {
        var sec = until(focus.block.end, clock);
        left.textContent = sec <= 0 ? "Ending" : spanText(sec) + " left";
        left.className = "pill left" + (sec < 15 * 60 ? " urgent" : "");
      }
      if (focus.next && !focus.later) {
        var remain = Math.max(0, until(focus.next.start, clock));
        var bar = document.getElementById("remain");
        var label = document.getElementById("remain-label");
        if (bar) bar.style.width = (Math.min(1, remain / waitSpan(focus.next)) * 100) + "%";
        if (label) label.textContent = spanText(remain);
      }
    }
  }
  var ticks = document.getElementById("ticks");
  for (var n = 0; n < 12; n++) if (n % 3) {
    var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("y1", "-78"); line.setAttribute("y2", "-72"); line.setAttribute("stroke-width", "1.25");
    line.setAttribute("transform", "rotate(" + (n * 30) + ")");
    ticks.appendChild(line);
  }
  var hourEl = document.getElementById("hour");
  var minuteEl = document.getElementById("minute");
  var secondEl = document.getElementById("second");
  function hands() {
    var d = new Date();
    var c = clockOf(d);
    var second = c.seconds + d.getMilliseconds() / 1000;
    var minute = (c.minutes % 60) + second / 60;
    var hour = (Math.floor(c.minutes / 60) % 12) + minute / 60;
    hourEl.setAttribute("transform", "rotate(" + (hour * 30) + ")");
    minuteEl.setAttribute("transform", "rotate(" + (minute * 6) + ")");
    secondEl.setAttribute("transform", "rotate(" + (second * 6) + ")");
    requestAnimationFrame(hands);
  }
  requestAnimationFrame(hands);
  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
