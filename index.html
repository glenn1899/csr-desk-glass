<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSR Desk</title>
<meta name="theme-color" content="#e7eef6">
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 480px at 8% -10%, rgba(120,180,255,.45), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(255,186,150,.35), transparent 55%),
      radial-gradient(800px 500px at 70% 110%, rgba(150,210,190,.35), transparent 50%),
      #e7eef6;
  }
  button, summary { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .wrap { max-width: 64rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
  .glass {
    border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 10px 28px rgba(40,55,90,.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }
  .top, .board { display: grid; gap: 1.5rem; align-items: start; }
  .board { margin-top: 1.5rem; }
  h1 { margin: 0; font-size: 2rem; line-height: 1; font-weight: 600; letter-spacing: -.03em; }
  .rail { margin-top: 1rem; display: flex; gap: .375rem; min-width: 0; overflow-x: auto; padding-bottom: .25rem; }
  .rail button {
    min-height: 3.5rem; min-width: 7rem; flex: 1 1 0;
    border-radius: 20px; padding: .5rem .6rem; text-align: left;
    border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 10px 28px rgba(40,55,90,.08);
  }
  .rail button[aria-pressed="true"] { background: rgba(29,29,31,.82); color: #fff; }
  .rail button.past { background: rgba(255,255,255,.4); color: #6e6e73; }
  .rail .win { display: flex; align-items: center; gap: .35rem; font-size: 11px; letter-spacing: .04em; }
  .rail .dot { width: .375rem; height: .375rem; border-radius: 999px; background: #007aff; }
  .rail .name { display: block; margin-top: .125rem; font-size: 13px; font-weight: 500; }
  .clock-col { width: 10.5rem; justify-self: center; }
  .clock { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 16px 30px rgba(40,60,100,.16)); }
  .date { margin: .5rem 0 0; text-align: center; font-size: 13px; color: #86868b; white-space: nowrap; }
  .card { min-width: 0; overflow: hidden; border-radius: 28px; }
  .meter { height: .375rem; background: rgba(0,0,0,.05); }
  .meter > span { display: block; height: 100%; background: #007aff; }
  .pad { padding: 1.75rem 1.5rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  .pill {
    display: inline-flex; align-items: center; border-radius: 999px;
    padding: .25rem .75rem; border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.55); box-shadow: inset 0 1px 0 #fff;
  }
  .now-kicker { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #007aff; }
  .left { font-size: .875rem; font-weight: 500; font-variant-numeric: tabular-nums; color: #3a3a3c; }
  .left.urgent { color: #ff3b30; }
  h2.title { margin: 1rem 0 0; font-size: 2.5rem; line-height: 1; font-weight: 600; letter-spacing: -.035em; }
  .window { margin-top: 1rem; font-size: 15px; font-weight: 500; color: #3a3a3c; font-variant-numeric: tabular-nums; }
  .manager { margin: .75rem 0 0; font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: #007aff; }
  .phone { margin-top: 1.5rem; display: flex; align-items: center; gap: .75rem; border-radius: 22px; padding: .75rem 1rem; }
  .phone .well {
    width: 2.75rem; height: 2.75rem; flex: 0 0 auto; display: grid; place-items: center;
    border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid rgba(255,255,255,.8);
  }
  .phone .k { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .6; }
  .phone .v { margin: 0; font-size: 17px; font-weight: 600; }
  .tasks { margin-top: 1.5rem; overflow: hidden; border-radius: 22px; padding: .25rem 1rem; }
  .task {
    display: grid; grid-template-columns: 2.75rem 5.25rem minmax(0,1fr);
    align-items: start; column-gap: .75rem;
    border-top: 1px solid rgba(0,0,0,.05); padding: .75rem 0;
  }
  .task:first-child { border-top: 0; }
  .task.off { opacity: .45; }
  .box {
    width: 1.5rem; height: 1.5rem; border-radius: 7px;
    display: grid; place-items: center; background: rgba(255,255,255,.8);
    box-shadow: inset 0 0 0 1px #c7c7cc;
  }
  .box.on { background: #007aff; box-shadow: none; animation: pop 220ms ease-out; }
  .box svg { width: .875rem; height: .875rem; }
  .hit { width: 2.75rem; height: 1.5rem; display: grid; place-items: center; }
  .chip {
    height: 1.5rem; display: flex; align-items: center; justify-content: center;
    border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    background: rgba(0,0,0,.05); color: #6e6e73;
  }
  .chip.do { background: rgba(0,122,255,.12); color: #007aff; }
  .task p { margin: 0; font-size: 16px; line-height: 1.5rem; }
  .task p.done { color: #86868b; }
  .due { margin-top: .25rem; font-size: 13px; line-height: 1.25rem; color: #86868b; }
  .due.late { color: #ff3b30; font-weight: 500; }
  .count { margin: 1rem 0 0; font-size: 13px; color: #86868b; font-variant-numeric: tabular-nums; }
  .exit { margin: 1.5rem 0 0; padding-top: 1.25rem; border-top: 1px solid #e5e5ea; font-size: 15px; line-height: 1.45; color: #6e6e73; }
  .next {
    border-radius: 28px; padding: 1rem; color: #6e6e73; filter: grayscale(1);
    background: rgba(255,255,255,.3);
  }
  .next h2 { margin: .5rem 0 0; font-size: 17px; line-height: 1.25; font-weight: 500; }
  .next .meta, .next li, .next .kicker { font-size: 12px; }
  .next .kicker { margin: 0; letter-spacing: .04em; text-transform: uppercase; }
  .next ul { margin: .75rem 0 0; padding: .75rem 0 0; list-style: none; border-top: 1px solid rgba(0,0,0,.1); }
  .next li { margin: 0 0 .5rem; line-height: 1.45; }
  .next li b { font-weight: 500; }
  .remain { margin-top: .5rem; display: flex; align-items: center; gap: .75rem; }
  .track { height: .375rem; flex: 1; border-radius: 999px; background: rgba(0,0,0,.1); overflow: hidden; }
  .track > span { display: block; height: 100%; border-radius: 999px; background: #007aff; }
  .remain b { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; color: #1d1d1f; }
  .banner {
    margin-bottom: 1.25rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem;
    border-radius: 999px; background: #1d1d1f; color: #fff; padding: .5rem .5rem .5rem 1rem; font-size: .875rem;
  }
  .banner button { min-height: 2.25rem; border-radius: 999px; background: #fff; color: #1d1d1f; padding: 0 .75rem; font-weight: 500; }
  details { margin-top: 2rem; }
  summary { display: flex; min-height: 2.75rem; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 500; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary svg { width: 1rem; height: 1rem; color: #86868b; transition: transform .2s; }
  details[open] summary svg { transform: rotate(180deg); }
  .day { margin-top: .5rem; overflow: hidden; border-radius: 22px; }
  .day button, .day .foot { width: 100%; display: flex; gap: .75rem; text-align: left; padding: .75rem 1rem; border-bottom: 1px solid rgba(0,0,0,.04); }
  .day .foot { display: block; font-size: 13px; color: #6e6e73; border: 0; }
  .day .mark { width: .5rem; height: .5rem; margin-top: .4rem; border-radius: 999px; background: #d2d2d7; flex: 0 0 auto; }
  .day .mark.live { background: #007aff; }
  .day .when { width: 7rem; flex: 0 0 auto; font-size: 13px; color: #86868b; font-variant-numeric: tabular-nums; }
  .day .ttl { display: block; font-size: 15px; font-weight: 500; }
  .day .sub { display: block; margin-top: .125rem; font-size: 13px; color: #86868b; }
  .fine { margin: 2rem 0 0; font-size: 12px; color: #86868b; }
  .hero { padding: 2.5rem 1.75rem; border-radius: 28px; }
  .hero h2 { margin: .5rem 0 0; font-size: 3rem; line-height: 1; letter-spacing: -.03em; }
  .hero p { color: #6e6e73; font-size: 1.125rem; }
  .eyebrow { margin: 0; font-size: 13px; font-weight: 500; color: #86868b; }
  .note { margin-bottom: 1.25rem; border-radius: 22px; padding: .85rem 1rem; font-size: .875rem; color: #3a3a3c; }
  .loc { margin: .75rem 0 0; font-size: 15px; color: #3a3a3c; overflow-wrap: anywhere; }
  .retry { margin-top: 1.25rem; min-height: 2.75rem; border-radius: 999px; background: #1d1d1f; color: #fff; padding: 0 1rem; font-weight: 500; }
  h2.title, .next h2, .day .ttl { overflow-wrap: anywhere; }
  .rail .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #next:empty { display: none; }
  .tick { width: 3.5rem; height: 3.5rem; display: grid; place-items: center; border-radius: 999px; background: #34c759; color: #fff; }
  @media (min-width: 1024px) {
    .top, .board { grid-template-columns: minmax(0,1.7fr) minmax(16rem,.85fr); column-gap: 2rem; }
    .rail { overflow: visible; }
    .rail button { min-width: 0; }
    h2.title { font-size: 3.75rem; }
    .next { position: sticky; top: 1.5rem; }
    .pad { padding: 2rem; }
    .board:has(#next:empty) { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 640px) {
    .hero h2 { font-size: 2.25rem; }
  }
  @keyframes pop { 0% { transform: scale(.82); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<main class="wrap">
  <p class="sr" id="live" aria-live="polite"></p>
  <div id="banner"></div>
  <div class="top">
    <div>
      <h1>CSR Desk</h1>
      <nav class="rail" id="rail" aria-label="Today"></nav>
    </div>
    <div class="clock-col">
      <div id="face" role="img" aria-label="Eastern time">
        <svg class="clock" viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="98" fill="rgba(255,255,255,.45)"/>
          <circle cx="100" cy="100" r="92" fill="#f7f7f5"/>
          <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.25"/>
          <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(29,29,31,.08)" stroke-width="1"/>
          <g transform="translate(100 100)" stroke="#1d1d1f" id="ticks"></g>
          <g id="nums" fill="#1d1d1f" font-size="13" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif"></g>
          <g transform="translate(100 100)">
            <g id="hour">
              <line y1="10" y2="-34" stroke="#1c1c1e" stroke-width="3.4" stroke-linecap="square"/>
              <line y1="-34" y2="-44" stroke="#c5d7b4" stroke-width="3.4" stroke-linecap="square"/>
            </g>
            <g id="minute">
              <line y1="14" y2="-56" stroke="#1c1c1e" stroke-width="2.15" stroke-linecap="square"/>
              <line y1="-56" y2="-68" stroke="#c5d7b4" stroke-width="2.15" stroke-linecap="square"/>
            </g>
            <g id="second"><line y1="24" y2="-74" stroke="#e2b100" stroke-width="1.35"/></g>
            <circle r="5.5" fill="#e2b100"/>
            <circle r="1.7" fill="#1c1c1e"/>
          </g>
        </svg>
      </div>
      <p class="date" id="date">Eastern</p>
    </div>
  </div>
  <div class="board">
    <div id="now"></div>
    <div id="next"></div>
  </div>
  <div id="tail"></div>
  <p class="fine" id="fine">Eastern time.</p>
</main>
<script>
(function () {
  var REFRESH_MS = 3 * 60 * 1000;
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var SHORT = { January:"Jan", February:"Feb", March:"Mar", April:"Apr", May:"May", June:"Jun", July:"Jul", August:"Aug", September:"Sep", October:"Oct", November:"Nov", December:"Dec" };
  var data = null;
  var status = "loading";
  var errorMsg = "";
  var preview = null;
  var sig = "";
  var seen = undefined;
  var pullGen = 0;
  var fetchedAt = 0;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return "&" + { "&":"amp", "<":"lt", ">":"gt", '"':"quot", "'":"#39" }[c] + ";";
    });
  }
  function part(parts, type) {
    for (var i = 0; i < parts.length; i++) if (parts[i].type === type) return parts[i].value;
    return "";
  }
  function clockOf(date) {
    var parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Toronto", weekday: "short", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23", timeZoneName: "short"
    }).formatToParts(date);
    var hour = Number(part(parts, "hour"));
    var minute = Number(part(parts, "minute"));
    var second = Number(part(parts, "second"));
    var year = part(parts, "year");
    var month = part(parts, "month");
    var day = part(parts, "day");
    var weekday = part(parts, "weekday");
    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    if (days.indexOf(weekday) < 0) weekday = "Mon";
    // Some browsers report midnight as 24:00 on the previous date.
    if (hour === 24) {
      hour = 0;
      var rolled = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day) + 1));
      year = String(rolled.getUTCFullYear());
      month = pad(rolled.getUTCMonth() + 1);
      day = pad(rolled.getUTCDate());
    }
    return {
      ymd: year + "-" + month + "-" + day,
      weekday: weekday, minutes: hour * 60 + minute, seconds: second,
      dateLabel: new Intl.DateTimeFormat("en-US", { timeZone:"America/Toronto", weekday:"long", month:"long", day:"numeric" }).format(date),
      tz: part(parts, "timeZoneName") || "ET"
    };
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function torontoYmd(date) { return clockOf(date).ymd; }
  function shortDate(ymd) {
    var p = String(ymd || "").split("-");
    if (p.length < 3) return "";
    return MONTHS[Number(p[1]) - 1] + " " + Number(p[2]);
  }
  function dayBefore(ymd) {
    var p = ymd.split("-");
    var dt = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] - 1));
    return dt.getUTCFullYear() + "-" + pad(dt.getUTCMonth() + 1) + "-" + pad(dt.getUTCDate());
  }
  function formatTime(date) {
    return new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Toronto", hour: "numeric", minute: "2-digit"
    }).format(date);
  }
  function allDayLabel(ev) {
    var last = dayBefore(ev.endDate);
    if (!last || last === ev.startDate) return "All day";
    return "All day · " + shortDate(ev.startDate) + " – " + shortDate(last);
  }
  function formatWindow(ev) {
    if (ev.allDay) return allDayLabel(ev);
    var start = new Date(ev.start);
    var end = new Date(ev.end);
    var text = formatTime(start) + " – " + formatTime(end);
    if (torontoYmd(start) !== torontoYmd(end)) text += " " + shortDate(torontoYmd(end));
    return text;
  }
  function usable(ev) {
    if (!ev || !ev.id || !ev.title) return false;
    if (ev.allDay) return !!ev.startDate && !!ev.endDate;
    var start = new Date(ev.start).getTime();
    var end = new Date(ev.end).getTime();
    return !isNaN(start) && !isNaN(end) && end > start;
  }
  function events() {
    return data && Array.isArray(data.events) ? data.events.filter(usable) : [];
  }
  function onDay(ev, ymd) {
    if (ev.allDay) return ev.startDate <= ymd && ymd < ev.endDate;
    var start = torontoYmd(new Date(ev.start));
    var end = torontoYmd(new Date(new Date(ev.end).getTime() - 1));
    return start <= ymd && ymd <= end;
  }
  function isCurrent(ev, now) {
    if (!ev || ev.allDay) return false;
    var t = now.getTime();
    return new Date(ev.start).getTime() <= t && t < new Date(ev.end).getTime();
  }
  function pickCurrent(list, now) {
    var hits = list.filter(function (ev) { return isCurrent(ev, now); });
    hits.sort(function (a, b) {
      return new Date(b.start) - new Date(a.start) || (new Date(a.end) - new Date(a.start)) - (new Date(b.end) - new Date(b.start));
    });
    return hits[0] || null;
  }
  function pickNext(list, now) {
    var t = now.getTime();
    var hits = list.filter(function (ev) { return !ev.allDay && new Date(ev.start).getTime() > t; });
    hits.sort(function (a, b) { return new Date(a.start) - new Date(b.start); });
    return hits[0] || null;
  }
  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function afterEvent(list, event) {
    var start = event.allDay ? event.startDate + "T99" : event.start;
    var next = null;
    for (var i = 0; i < list.length; i++) {
      var ev = list[i];
      if (ev.allDay || ev.id === event.id) continue;
      if (ev.start > start && (!next || ev.start < next.start)) next = ev;
    }
    return next;
  }
  function spanText(total) {
    var sec = Math.max(0, Math.floor(total)), h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (sec < 15 * 60) return m + "m " + (s < 10 ? "0" : "") + s + "s";
    if (h > 0) return m > 0 ? h + "h " + m + "m" : h + "h";
    return m + "m";
  }
  function progress(ev, now) {
    var start = new Date(ev.start).getTime();
    var end = new Date(ev.end).getTime();
    var span = end - start;
    if (span <= 0) return 0;
    return Math.max(0, Math.min(1, (now.getTime() - start) / span));
  }
  function remainFrac(ev, now, current) {
    var remain = Math.max(0, (new Date(ev.start).getTime() - now.getTime()) / 1000);
    var span = 2 * 60 * 60;
    if (current && !current.allDay) {
      span = Math.max(60, (new Date(ev.start).getTime() - new Date(current.start).getTime()) / 1000);
    }
    return { remain: remain, frac: Math.min(1, remain / span) };
  }
  function sourceLabel() {
    if (!data) return "";
    if (data.source === "sample") return "Sample data";
    if (data.source === "google") return "Google Calendar";
    if (data.source === "ics") return "Calendar feed";
    return "";
  }
  function fineText() {
    var bits = ["Eastern time"];
    var label = sourceLabel();
    if (label) bits.push(label);
    if (data && data.generatedAt) bits.push("Updated " + formatTime(new Date(data.generatedAt)));
    return bits.join(" · ");
  }
  function hero(kicker, title, copy, extra) {
    return '<section class="hero glass"><p class="eyebrow">' + esc(kicker) + "</p><h2>" + esc(title) + "</h2><p>" + esc(copy) + "</p>" + (extra || "") + "</section>";
  }
  function eventCard(ev, now, live) {
    var left = live ? Math.round((new Date(ev.end).getTime() - now.getTime()) / 1000) : null;
    var urgent = left != null && left < 15 * 60;
    var loc = ev.location ? '<p class="loc">' + esc(ev.location) + "</p>" : "";
    return '<section class="card glass">' +
      (live ? '<div class="meter"><span id="meter" style="width:' + (progress(ev, now) * 100) + '%"></span></div>' : "") +
      '<div class="pad"><div class="row"><p class="pill now-kicker">' + (live ? "Now" : "Preview") + "</p>" +
      (left == null ? "" : '<p class="pill left' + (urgent ? " urgent" : "") + '" id="left">' + (left <= 0 ? "Ending" : spanText(left) + " left") + "</p>") +
      '</div><h2 class="title">' + esc(ev.title) + "</h2>" +
      '<p class="pill window">' + esc(formatWindow(ev)) + "</p>" + loc + "</div></section>";
  }
  function freeHtml(next, allDay) {
    var hint = next ? "Next up at " + formatTime(new Date(next.start)) + "." : "Nothing else coming up.";
    var extra = allDay.length ? "<p>" + allDay.map(function (ev) { return esc(ev.title); }).join(" · ") + "</p>" : "";
    return hero("Open", "Free right now", hint, extra);
  }
  function nextHtml(ev, now, current, showRemain) {
    if (!ev) return "";
    var remain = null;
    var frac = 0;
    if (showRemain && !ev.allDay) {
      var gap = remainFrac(ev, now, current);
      remain = gap.remain;
      frac = gap.frac;
    }
    var loc = ev.location ? '<p class="meta">' + esc(ev.location) + "</p>" : "";
    return '<aside class="next glass"><p class="kicker">Up next</p>' +
      (remain == null ? "" : '<div class="remain"><div class="track"><span id="remain" style="width:' + (frac * 100) + '%"></span></div><b id="remain-label">' + spanText(remain) + "</b></div>") +
      "<h2>" + esc(ev.title) + "</h2><p class=\"meta\">" + esc(formatWindow(ev)) + "</p>" + loc + "</aside>";
  }
  function agendaHtml(list, now) {
    if (!list.length) return "";
    var shown = list.slice(0, 30);
    var rows = shown.map(function (ev) {
      var live = isCurrent(ev, now);
      var when = ev.allDay ? "All day" : formatTime(new Date(ev.start));
      var sub = ev.location || (ev.allDay ? shortDate(ev.startDate) : shortDate(torontoYmd(new Date(ev.start))));
      return '<button type="button" data-pick="' + esc(ev.id) + '"><span class="mark' + (live ? " live" : "") + '"></span><span class="when">' + esc(when) + '</span><span><span class="ttl">' + esc(ev.title) + (live ? " · now" : "") + '</span><span class="sub">' + esc(sub) + "</span></span></button>";
    }).join("");
    var more = list.length > shown.length ? '<p class="foot">' + (list.length - shown.length) + " more in the next two weeks.</p>" : "";
    return '<details><summary>On the calendar <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></summary><div class="day glass">' + rows + more + "</div></details>";
  }
  function wire() {
    var back = document.getElementById("back");
    if (back) back.onclick = function () { preview = null; sig = ""; render(); };
    var retry = document.getElementById("retry");
    if (retry) retry.onclick = function () { pull(); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-pick]"), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-pick");
        var list = events();
        var current = pickCurrent(list, new Date());
        preview = preview === id || (current && id === current.id) ? null : id;
        sig = "";
        render();
      };
    });
  }
  function render() {
    var now = new Date();
    var clock = clockOf(now);
    var list = events();
    if (preview && !byId(list, preview)) preview = null;
    var current = status === "ready" || data ? pickCurrent(list, now) : null;
    var focus = preview ? byId(list, preview) : current;
    var upcoming = preview && focus ? afterEvent(list, focus) : pickNext(list, now);
    var name = current ? current.title : (status === "ready" ? "Free right now" : "");
    if (seen !== undefined && seen !== name && !preview && name) {
      document.getElementById("live").textContent = "Now: " + name;
    }
    seen = name;
    var match = clock.dateLabel.match(/^(.+), ([A-Za-z]+) (\d+)$/);
    document.getElementById("date").textContent = match ? match[1] + ", " + (SHORT[match[2]] || match[2]) + " " + match[3] + " · " + clock.tz : clock.dateLabel;
    document.getElementById("face").setAttribute("aria-label", clock.dateLabel);
    document.getElementById("fine").textContent = fineText();
    var today = list.filter(function (ev) { return onDay(ev, clock.ymd); }).slice(0, 20);
    var allDay = today.filter(function (ev) { return ev.allDay; });
    var eventKey = list.map(function (ev) { return ev.id + ev.title + (ev.start || ev.startDate) + (ev.end || ev.endDate); }).join(",");
    var nextSig = [status, errorMsg, preview || "", clock.ymd, data && data.source || "", current && current.id || "", upcoming && upcoming.id || "", eventKey].join("|");
    if (nextSig === sig) {
      if ((status === "ready" || data) && !preview && current) {
        var meter = document.getElementById("meter");
        if (meter) meter.style.width = (progress(current, now) * 100) + "%";
        var left = document.getElementById("left");
        if (left) {
          var sec = Math.round((new Date(current.end).getTime() - now.getTime()) / 1000);
          left.textContent = sec <= 0 ? "Ending" : spanText(sec) + " left";
          left.className = "pill left" + (sec < 15 * 60 ? " urgent" : "");
        }
      }
      if ((status === "ready" || data) && !preview && upcoming && !upcoming.allDay) {
        var gap = remainFrac(upcoming, now, current);
        var bar = document.getElementById("remain");
        var label = document.getElementById("remain-label");
        if (bar) bar.style.width = (gap.frac * 100) + "%";
        if (label) label.textContent = spanText(gap.remain);
      }
      return;
    }
    sig = nextSig;
    var banner = "";
    if (preview && focus) {
      banner = '<div class="banner"><p>Previewing ' + esc(focus.title) + '.</p><button type="button" id="back">Back</button></div>';
    } else if (status === "error" && data) {
      banner = '<div class="note glass" role="status">' + esc(errorMsg) + "</div>";
    } else if (data && data.source === "sample" && data.notice && status !== "loading") {
      banner = '<div class="note glass" role="status">' + esc(data.notice) + "</div>";
    }
    document.getElementById("banner").innerHTML = banner;
    var nowHtml = "";
    var nextBlock = "";
    var tail = "";
    if (!data && status === "loading") {
      nowHtml = hero("Calendar", "Loading", "Checking today's events.");
    } else if (!data && status === "error") {
      nowHtml = hero("Calendar", "Unavailable", errorMsg, '<button class="retry" type="button" id="retry">Try again</button>');
    } else if (!list.length) {
      nowHtml = hero("Calendar", "Nothing scheduled", "No events today or in the next two weeks.");
    } else if (focus) {
      nowHtml = eventCard(focus, now, !preview && focus === current);
      nextBlock = nextHtml(upcoming, now, current, !preview);
      tail = agendaHtml(list, now);
    } else {
      nowHtml = freeHtml(upcoming, allDay);
      nextBlock = nextHtml(upcoming, now, null, !preview);
      tail = agendaHtml(list, now);
    }
    document.getElementById("rail").innerHTML = today.map(function (ev) {
      var past = !ev.allDay && new Date(ev.end).getTime() <= now.getTime();
      var on = focus && focus.id === ev.id && (preview || ev === current);
      var label = ev.allDay ? "All day" : formatTime(new Date(ev.start));
      return '<button type="button" data-pick="' + esc(ev.id) + '" aria-pressed="' + !!on + '"' + (past && !on ? ' class="past"' : "") + ">" +
        '<span class="win">' + (current && ev.id === current.id ? '<span class="dot"></span>' : "") + esc(label) + "</span>" +
        '<span class="name">' + esc(ev.title) + "</span></button>";
    }).join("");
    document.getElementById("now").innerHTML = nowHtml;
    document.getElementById("next").innerHTML = nextBlock;
    document.getElementById("tail").innerHTML = tail;
    wire();
  }
  function safeError(body) {
    var msg = body && typeof body.error === "string" ? body.error : "";
    if (!msg || msg.length > 180 || /https?:|token|secret|ya29|@/i.test(msg)) {
      return "The calendar didn't load. Trying again shortly.";
    }
    return msg;
  }
  function pull() {
    var gen = ++pullGen;
    fetch("/api/events", { headers: { accept: "application/json" }, cache: "no-store" })
      .then(function (res) {
        return res.text().then(function (text) {
          try { return JSON.parse(text); } catch (e) { return null; }
        });
      })
      .then(function (body) {
        if (gen !== pullGen) return;
        if (!body || body.ok !== true || !Array.isArray(body.events)) {
          status = "error";
          errorMsg = safeError(body);
        } else {
          status = "ready";
          data = body;
          errorMsg = "";
          fetchedAt = Date.now();
        }
        sig = "";
        render();
      })
      .catch(function () {
        if (gen !== pullGen) return;
        status = "error";
        errorMsg = "The calendar didn't load. Trying again shortly.";
        sig = "";
        render();
      });
  }
  var ticks = document.getElementById("ticks");
  for (var n = 0; n < 60; n++) {
    var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    var major = n % 5 === 0;
    line.setAttribute("y1", major ? "-78" : "-80");
    line.setAttribute("y2", "-84");
    line.setAttribute("stroke-width", major ? "1.35" : "0.7");
    line.setAttribute("transform", "rotate(" + (n * 6) + ")");
    ticks.appendChild(line);
  }
  var nums = document.getElementById("nums");
  for (var h = 1; h <= 12; h++) {
    var ang = ((h % 12) * 30 - 90) * Math.PI / 180;
    var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", String(100 + 64 * Math.cos(ang)));
    text.setAttribute("y", String(100 + 64 * Math.sin(ang)));
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "central");
    text.textContent = String(h);
    nums.appendChild(text);
  }
  var hourEl = document.getElementById("hour");
  var minuteEl = document.getElementById("minute");
  var secondEl = document.getElementById("second");
  function hands() {
    var d = new Date();
    var c = clockOf(d);
    var second = c.seconds + d.getMilliseconds() / 1000;
    var minute = (c.minutes % 60) + second / 60;
    var hour = (Math.floor(c.minutes / 60) % 12) + minute / 60;
    hourEl.setAttribute("transform", "rotate(" + (hour * 30) + ")");
    minuteEl.setAttribute("transform", "rotate(" + (minute * 6) + ")");
    secondEl.setAttribute("transform", "rotate(" + (second * 6) + ")");
    requestAnimationFrame(hands);
  }
  requestAnimationFrame(hands);
  render();
  pull();
  setInterval(function () {
    if (document.visibilityState === "hidden") return;
    pull();
  }, REFRESH_MS);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && Date.now() - fetchedAt > 2 * 60 * 1000) pull();
  });
})();
</script>

</body>
