<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSR Desk</title>
<meta name="theme-color" content="#e7eef6">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 480px at 8% -10%, rgba(120,180,255,.45), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(255,186,150,.35), transparent 55%),
      radial-gradient(800px 500px at 70% 110%, rgba(150,210,190,.35), transparent 50%),
      #e7eef6;
  }
  button, summary { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .wrap { max-width: 64rem; margin: 0 auto; padding: 1.25rem 1.25rem 2.5rem; }
  .glass {
    border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 10px 28px rgba(40,55,90,.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }
  .top, .board { display: grid; gap: 1.5rem; align-items: start; }
  .board { margin-top: 1rem; }
  h1 { margin: 0; font-size: 2rem; line-height: 1; font-weight: 600; letter-spacing: -.03em; }
  .rail { margin-top: 1rem; display: flex; gap: .375rem; min-width: 0; overflow-x: auto; padding-bottom: .25rem; }
  .rail button {
    min-height: 3.5rem; min-width: 7rem; flex: 1 1 0;
    border-radius: 20px; padding: .5rem .6rem; text-align: left;
    border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 10px 28px rgba(40,55,90,.08);
  }
  .rail button[aria-pressed="true"] { background: rgba(29,29,31,.82); color: #fff; }
  .rail button.past { background: rgba(255,255,255,.4); color: #6e6e73; }
  .rail .win { display: flex; align-items: center; gap: .35rem; font-size: 11px; letter-spacing: .04em; }
  .rail .dot { width: .375rem; height: .375rem; border-radius: 999px; background: #007aff; }
  .rail .name { display: block; margin-top: .125rem; font-size: 13px; font-weight: 500; }
  .clock-col { width: 10.5rem; justify-self: center; }
  .clock { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 16px 30px rgba(40,60,100,.16)); }
  .card { min-width: 0; overflow: hidden; border-radius: 28px; }
  .pad { padding: 1.75rem 1.5rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  .pill {
    display: inline-flex; align-items: center; border-radius: 999px;
    padding: .25rem .75rem; border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.55); box-shadow: inset 0 1px 0 #fff;
  }
  .now-kicker { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #007aff; }
  .hours { display: flex; align-items: center; gap: .3rem; min-height: 1.35rem; }
  .hour { display: block; flex: 0 0 auto; height: auto; }
  .hour svg { display: block; width: 100%; height: auto; }
  .hour svg .arc { transition: stroke-dashoffset .9s linear; }
  h2.title { margin: 1rem 0 0; font-size: 2.5rem; line-height: 1; font-weight: 600; letter-spacing: -.035em; }
  .window { margin-top: 1rem; font-size: 15px; font-weight: 500; color: #3a3a3c; font-variant-numeric: tabular-nums; }
  .manager { margin: .75rem 0 0; font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: #007aff; }
  .phone { margin-top: 1.5rem; display: flex; align-items: center; gap: .75rem; border-radius: 22px; padding: .75rem 1rem; }
  .phone .well {
    width: 2.75rem; height: 2.75rem; flex: 0 0 auto; display: grid; place-items: center;
    border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid rgba(255,255,255,.8);
  }
  .phone .k { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .6; }
  .phone .v { margin: 0; font-size: 17px; font-weight: 600; }
  .phone.on .v { color: #34c759; }
  .tasks { margin-top: 1.5rem; overflow: hidden; border-radius: 22px; padding: .25rem 1rem; }
  .task {
    display: grid; grid-template-columns: 2.75rem 5.25rem minmax(0,1fr);
    align-items: start; column-gap: .75rem;
    border-top: 1px solid rgba(0,0,0,.05); padding: .75rem 0;
  }
  .task:first-child { border-top: 0; }
  .task.off { opacity: .45; }
  .box {
    width: 1.5rem; height: 1.5rem; border-radius: 7px;
    display: grid; place-items: center; background: rgba(255,255,255,.8);
    box-shadow: inset 0 0 0 1px #c7c7cc;
  }
  .box.on { background: #007aff; box-shadow: none; animation: pop 220ms ease-out; }
  .box svg { width: .875rem; height: .875rem; }
  .hit { width: 2.75rem; height: 1.5rem; display: grid; place-items: center; }
  .chip {
    height: 1.5rem; display: flex; align-items: center; justify-content: center;
    border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    background: rgba(0,0,0,.05); color: #6e6e73;
  }
  .chip.do { background: rgba(0,122,255,.12); color: #007aff; }
  .task p { margin: 0; font-size: 16px; line-height: 1.5rem; }
  .task p.done { color: #86868b; }
  .due { margin-top: .25rem; font-size: 13px; line-height: 1.25rem; color: #86868b; }
  .due.late { color: #ff3b30; font-weight: 500; }
  .count { margin: 1rem 0 0; font-size: 13px; color: #86868b; font-variant-numeric: tabular-nums; }
  .exit { margin: 1.5rem 0 0; padding-top: 1.25rem; border-top: 1px solid #e5e5ea; font-size: 15px; line-height: 1.45; color: #6e6e73; }
  .next {
    border-radius: 28px; padding: 1rem; color: #6e6e73; filter: grayscale(1);
    background: rgba(255,255,255,.3);
  }
  .next h2 { margin: .5rem 0 0; font-size: 17px; line-height: 1.25; font-weight: 500; }
  .next .meta, .next li, .next .kicker { font-size: 12px; }
  .next .kicker { margin: 0; letter-spacing: .04em; text-transform: uppercase; }
  .next ul { margin: .75rem 0 0; padding: .75rem 0 0; list-style: none; border-top: 1px solid rgba(0,0,0,.1); }
  .next li { margin: 0 0 .5rem; line-height: 1.45; }
  .next li b { font-weight: 500; }
  .remain { margin-top: .5rem; display: flex; align-items: center; gap: .75rem; }
  .track { height: .375rem; flex: 1; border-radius: 999px; background: rgba(0,0,0,.1); overflow: hidden; }
  .track > span { display: block; height: 100%; border-radius: 999px; background: #007aff; }
  .remain b { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; color: #1d1d1f; }
  .banner {
    margin-bottom: 1.25rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem;
    border-radius: 999px; background: #1d1d1f; color: #fff; padding: .5rem .5rem .5rem 1rem; font-size: .875rem;
  }
  .banner button { min-height: 2.25rem; border-radius: 999px; background: #fff; color: #1d1d1f; padding: 0 .75rem; font-weight: 500; }
  details { margin-top: 1rem; }
  summary { display: flex; min-height: 2.75rem; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 500; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary svg { width: 1rem; height: 1rem; color: #86868b; transition: transform .2s; }
  details[open] summary svg { transform: rotate(180deg); }
  .day { margin-top: .5rem; overflow: hidden; border-radius: 22px; }
  .day button, .day .foot { width: 100%; display: flex; gap: .75rem; text-align: left; padding: .75rem 1rem; border-bottom: 1px solid rgba(0,0,0,.04); }
  .day .foot { display: block; font-size: 13px; color: #6e6e73; border: 0; }
  .day .mark { width: .5rem; height: .5rem; margin-top: .4rem; border-radius: 999px; background: #d2d2d7; flex: 0 0 auto; }
  .day .mark.live { background: #007aff; }
  .day .when { width: 7rem; flex: 0 0 auto; font-size: 13px; color: #86868b; font-variant-numeric: tabular-nums; }
  .day .ttl { display: block; font-size: 15px; font-weight: 500; }
  .day .sub { display: block; margin-top: .125rem; font-size: 13px; color: #86868b; }
  .fine { margin: 2rem 0 0; font-size: 12px; color: #86868b; }
  .meet { width: .375rem; height: .375rem; margin-left: .3rem; border-radius: 999px; background: #007aff; display: inline-block; }
  .meet.team { background: #ff9f0a; }
  .cal { margin-top: 0; border-radius: 28px; padding: 1rem; color: #1d1d1f; }
  .month { border-radius: 28px; padding: .85rem .65rem .7rem; }
  .month + .cal { margin-top: 1rem; }
  .mcap { margin: 0 0 .45rem; text-align: center; font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .mgrid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: 1rem repeat(6, 1.55rem);
    align-items: center;
    justify-items: center;
  }
  .mwd { font-size: 10px; font-weight: 600; letter-spacing: .05em; color: #86868b; }
  .mcell { font-size: 12px; font-variant-numeric: tabular-nums; color: #1d1d1f; line-height: 1; }
  .mcell.out { color: #c7c7cc; }
  .mcell.today span {
    min-width: 1.4rem; height: 1.4rem; padding: 0 .2rem;
    display: grid; place-items: center; border-radius: 999px;
    background: #007aff; color: #fff; font-weight: 600;
  }
  .cal h2 { margin: .5rem 0 0; font-size: 17px; line-height: 1.25; font-weight: 500; }
  .cal .slot { margin-top: .7rem; }
  .cal .slot h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .cal .slot .meta { margin: .12rem 0 0; }
  .cal .dayhead { margin: .8rem 0 0; font-size: 10px; font-weight: 600; letter-spacing: .08em; color: #86868b; }
  .cal .slot.later,
  .cal .slot.later .who { color: #86868b; }
  .cal .slot.later h2 { font-weight: 500; }
  .cal .kicker, .cal .meta { font-size: 12px; }
  .cal .kicker { margin: 0; letter-spacing: .04em; text-transform: uppercase; color: #007aff; }
  .cal .meta { margin: .35rem 0 0; color: #6e6e73; }
  .cal.team { box-shadow: inset 3px 0 0 #ff9f0a, 0 10px 28px rgba(40,55,90,.08); }
  .cal a, .cal button.retry {
    display: inline-flex; margin-top: .75rem; margin-right: .5rem; min-height: 2.25rem; align-items: center;
    border-radius: 999px; background: #1d1d1f; color: #fff; padding: 0 .85rem; text-decoration: none; font-weight: 500;
  }
  .hero { padding: 2.5rem 1.75rem; border-radius: 28px; }
  .hero h2 { margin: .5rem 0 0; font-size: 3rem; line-height: 1; letter-spacing: -.03em; }
  .hero p { color: #6e6e73; font-size: 1.125rem; }
  .tick { width: 3.5rem; height: 3.5rem; display: grid; place-items: center; border-radius: 999px; background: #34c759; color: #fff; }
  @media (min-width: 1024px) {
    .top, .board { grid-template-columns: minmax(0,1.7fr) minmax(16rem,.85fr); column-gap: 2rem; }
    .rail { overflow: visible; }
    .rail button { min-width: 0; }
    h2.title { font-size: 3.75rem; }
    .next { position: sticky; top: 1.5rem; }
    .pad { padding: 2rem; }
  }
  @keyframes pop { 0% { transform: scale(.82); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<main class="wrap">
  <p class="sr" id="live" aria-live="polite"></p>
  <div id="banner"></div>
  <div class="top">
    <div>
      <h1>CSR Desk</h1>
      <nav class="rail" id="rail" aria-label="Day blocks"></nav>
    </div>
    <div class="clock-col">
      <div id="face" role="img" aria-label="Eastern time">
        <svg class="clock" viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="98" fill="rgba(255,255,255,.45)"/>
          <circle cx="100" cy="100" r="92" fill="#f7f7f5"/>
          <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.25"/>
          <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(29,29,31,.08)" stroke-width="1"/>
          <g transform="translate(100 100)" stroke="#1d1d1f" id="ticks"></g>
          <g id="nums" fill="#1d1d1f" font-size="13" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif"></g>
          <g id="daywin">
            <rect x="114" y="86" width="40" height="28" rx="7" fill="#f7f4ee" stroke="rgba(29,29,31,.16)"/>
            <text id="daywk" x="134" y="97" text-anchor="middle" fill="#6e6e73" font-size="7" font-weight="600" letter-spacing="0.9" font-family="-apple-system, BlinkMacSystemFont, sans-serif">MON</text>
            <text id="daynum" x="134" y="109" text-anchor="middle" fill="#1d1d1f" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">2</text>
          </g>
          <g transform="translate(100 100)">
            <g id="hour">
              <line y1="10" y2="-34" stroke="#1c1c1e" stroke-width="3.4" stroke-linecap="square"/>
              <line y1="-34" y2="-44" stroke="#c5d7b4" stroke-width="3.4" stroke-linecap="square"/>
            </g>
            <g id="minute">
              <line y1="14" y2="-56" stroke="#1c1c1e" stroke-width="2.15" stroke-linecap="square"/>
              <line y1="-56" y2="-68" stroke="#c5d7b4" stroke-width="2.15" stroke-linecap="square"/>
            </g>
            <g id="second"><line y1="24" y2="-74" stroke="#e2b100" stroke-width="1.35"/></g>
            <circle r="5.5" fill="#e2b100"/>
            <circle r="1.7" fill="#1c1c1e"/>
          </g>
        </svg>
      </div>
    </div>
  </div>
  <div class="board">
    <div id="now"></div>
    <div id="next"></div>
  </div>
  <div id="tail"></div>
  <p class="fine">Sheet updated Oct 29, 2026. Eastern time.</p>
</main>
<script>
(function () {
  var EXIT = "Inbox and voicemail at zero, or every open item has an owner and a deadline.";
  var TAG = { do: "Do now", resolve: "Resolve", batch: "Batch", park: "Park", note: "Note" };
  var BLOCKS = [
    { id:"before", start:0, end:570, from:480, window:"Before 9:30", title:"Onboarding review", short:"Open", manager:true, phone:null, tasks:[
      { id:"before-abeyance", tag:"do", text:"Check the abeyance list. Flag anything overdue." },
      { id:"before-claims", tag:"do", text:"Export the claims report by insurer.", monday:true, due:540 }
    ]},
    { id:"morning", start:570, end:630, window:"9:30–10:30", title:"Morning batch", short:"Morning", phone:{ mode:"off", label:"No phone." }, tasks:[
      { id:"morning-clear", tag:"do", text:"Clear overnight voicemail and email. Glance at the claims list for anything stalled. Knock out anything due today." },
      { id:"morning-resolve", tag:"resolve", text:"By 10:30, every item has an answer: call back now, file with a note, or promise a time." }
    ]},
    { id:"midday", start:630, end:870, window:"10:30–2:30", title:"Midday block", short:"Midday", phone:{ mode:"finish", label:"Phone on, finish-now only." }, tasks:[
      { id:"midday-now", tag:"do", text:"ID cards, proof of insurance, claim status, simple changes." },
      { id:"midday-batch", tag:"batch", text:"60-day renewal emails batched here. Emails and texts outside 30 days go out as heads-up notices." },
      { id:"midday-park", tag:"park", text:"More than a quick fix (about 2 minutes or more)? Park it with a promised time." },
      { id:"midday-resolve", tag:"resolve", text:"Triage rule: park longer work to the 2:30–3:30 protected block, where those tasks are batched." }
    ]},
    { id:"protected", start:870, end:930, window:"2:30–3:30", title:"Protected block", short:"Protected", phone:{ mode:"overflow", label:"Phone to overflow and voicemail." }, tasks:[
      { id:"protected-renewals", tag:"do", text:"First: renewal calls for policies renewing within 30 days." },
      { id:"protected-batch", tag:"batch", text:"Then parked work: endorsements, file admin." }
    ]},
    { id:"agency", start:930, end:940, window:"3:30–3:40", title:"Agency-bill mini-block", short:"Agency bill", phone:{ mode:"on", label:"Phone on." }, tasks:[
      { id:"agency-remind", tag:"do", text:"Send payment-due reminders on agency-bill accounts. A lapse is the one thing a later call can’t undo." },
      { id:"agency-note", tag:"note", text:"Call, text, or email, depending on the collections-reminder stage." }
    ]},
    { id:"afternoon", start:940, end:1020, window:"3:40–5:00", title:"Afternoon phones", short:"Afternoon", phone:{ mode:"finish", label:"Phone back on, finish-now only." }, tasks:[
      { id:"afternoon-overflow", tag:"do", text:"Clear the overflow." },
      { id:"afternoon-abeyance", tag:"do", text:"Export abeyance reports before the end of the day." },
      { id:"afternoon-park", tag:"park", text:"Before you leave, every open item gets an owner and a time." }
    ]}
  ];
  var preview = null;
  var checks = [];
  var ymd = "";
  var sig = "";
  var seen = undefined;
  var REFRESH_MS = 60 * 1000;
  var data = null;
  var status = "loading";
  var errorMsg = "";
  var reason = "";
  var connectNote = "";
  var pullGen = 0;
  var fetchedAt = 0;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return "&" + { "&":"amp", "<":"lt", ">":"gt", '"':"quot", "'":"#39" }[c] + ";";
    });
  }
  function part(parts, type) {
    for (var i = 0; i < parts.length; i++) if (parts[i].type === type) return parts[i].value;
    return "";
  }
  function clockOf(date) {
    var parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Toronto", weekday: "short", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23", timeZoneName: "short"
    }).formatToParts(date);
    var hour = Number(part(parts, "hour"));
    var minute = Number(part(parts, "minute"));
    var second = Number(part(parts, "second"));
    var weekday = part(parts, "weekday");
    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    if (days.indexOf(weekday) < 0) weekday = "Mon";
    return {
      ymd: part(parts, "year") + "-" + part(parts, "month") + "-" + part(parts, "day"),
      weekday: weekday, minutes: hour * 60 + minute, seconds: second,
      dateLabel: new Intl.DateTimeFormat("en-US", { timeZone:"America/Toronto", weekday:"long", month:"long", day:"numeric" }).format(date),
      tz: part(parts, "timeZoneName") || "ET"
    };
  }
  function liveId(c) {
    if (c.weekday === "Sat" || c.weekday === "Sun") return null;
    for (var i = 0; i < BLOCKS.length; i++) if (c.minutes >= BLOCKS[i].start && c.minutes < BLOCKS[i].end) return BLOCKS[i].id;
    return null;
  }
  function focusFor(c) {
    if (preview) {
      for (var i = 0; i < BLOCKS.length; i++) if (BLOCKS[i].id === preview) {
        var mon = c.weekday === "Mon";
        return { kind:"block", block: BLOCKS[i], next: BLOCKS[i + 1] || null, later: false, monday: mon };
      }
    }
    if (c.weekday === "Sat" || c.weekday === "Sun") return { kind:"weekend", block:null, next:null, later:true, monday:false };
    for (var j = 0; j < BLOCKS.length; j++) {
      if (c.minutes >= BLOCKS[j].start && c.minutes < BLOCKS[j].end) {
        var nxt = BLOCKS[j + 1] || null;
        return { kind:"block", block: BLOCKS[j], next: nxt, later: !nxt, monday: c.weekday === "Mon" };
      }
    }
    return { kind:"closed", block:null, next:null, later:true, monday:false };
  }
  function until(min, c) { return (min - c.minutes) * 60 - c.seconds; }
  /* hour-circles */
  function blockSpanMinutes(block) {
    var origin = block.from == null ? block.start : block.from;
    return Math.max(0, block.end - origin);
  }
  function hourCircles(lengthMinutes, remainingSeconds) {
    var spanMin = Math.max(0, Number(lengthMinutes) || 0);
    var fullHours = Math.floor(spanMin / 60);
    var restMin = spanMin - fullHours * 60;
    var pieces = [];
    var i;
    for (i = 0; i < fullHours; i++) pieces.push({ size: 1, seconds: 3600 });
    if (restMin > 0) pieces.push({ size: restMin / 60, seconds: restMin * 60 });
    var spanSec = 0;
    for (i = 0; i < pieces.length; i++) spanSec += pieces[i].seconds;
    var left = Math.max(0, Number(remainingSeconds) || 0);
    if (left > spanSec) left = spanSec;
    var consumed = spanSec - left;
    var cursor = 0;
    return pieces.map(function (piece) {
      var start = cursor;
      var end = cursor + piece.seconds;
      cursor = end;
      var fill = consumed <= start ? 1 : consumed >= end ? 0 : (end - consumed) / (end - start);
      return { size: piece.size, fill: fill };
    });
  }
  /* hour-circles-end */
  function leftLabel(seconds) {
    return seconds <= 0 ? "Ending" : spanText(seconds) + " left";
  }
  function ringSvg(fill) {
    var circ = 2 * Math.PI * 12;
    var shown = Math.max(0, Math.min(1, fill));
    var offset = (circ * (1 - shown)).toFixed(3);
    return '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="rgba(0,0,0,.1)" stroke-width="3.25"/>' +
      '<circle class="arc" cx="16" cy="16" r="12" fill="none" stroke="#007aff" stroke-width="3.25" stroke-linecap="butt" stroke-dasharray="' + circ.toFixed(3) + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 16 16)"' + (shown <= 0 ? ' stroke-opacity="0"' : "") + "/></svg>";
  }
  function hourMarksHtml(block, seconds) {
    var marks = hourCircles(blockSpanMinutes(block), Math.max(0, seconds));

        sig = "";
        render();
      })
      .catch(function () {
        if (gen !== pullGen) return;
        status = "error";
        errorMsg = "The calendar didn't load. Trying again shortly.";
        reason = "";
        sig = "";
        render();
      });
  }
})();
</script>
</body>
